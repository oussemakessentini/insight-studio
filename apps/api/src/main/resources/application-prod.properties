# Production profile: SPRING_PROFILES_ACTIVE=prod (docs/production.md). The API refuses to start
# unless the app is configured for HTTPS (ProductionSafetyCheck) and every setting below without a
# default is provided.

# HTTPS only: Secure cookies, and a __Host- session cookie (Secure, Path=/, no Domain: it cannot be
# set or overwritten by another subdomain).
insight.security.cookie-secure=true
server.servlet.session.cookie.name=__Host-SESSION

# Required: the public https:// address of the web app (links in emails).
insight.accounts.web-base-url=${WEB_BASE_URL}

# Required: a real SMTP server. Submission on 587 with STARTTLS and authentication by default.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
insight.mail.from=${MAIL_FROM}

# Billing: off unless configured (the fake provider is refused here). With BILLING_PROVIDER=stripe, set
# STRIPE_SECRET_KEY (test mode), STRIPE_WEBHOOK_SECRET and BILLING_PRO_PRICE_ID (docs/billing-api.md).
insight.billing.provider=${BILLING_PROVIDER:none}
