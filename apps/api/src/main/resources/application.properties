spring.application.name=insight-api

# Local development reads POSTGRES_* from infra/.env (git-ignored) when it exists.
# The paths cover running from apps/api (mvnw) and from the repository root (some IDEs).
spring.config.import=optional:file:../../infra/.env[.properties],optional:file:infra/.env[.properties]

# DB_* environment variables take precedence over infra/.env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/${POSTGRES_DB:insight_studio}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:insight}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Public demo (docs/auth.md): anonymous, read-only access to the demo business. Off unless
# explicitly enabled; the "demo" profile turns it on.
insight.demo.public=false
insight.demo.business-slug=fieldstone-apparel

# Sessions: server-side in PostgreSQL (Spring Session JDBC, tables from Flyway V5), shared by every
# API instance and kept across restarts. Expired sessions are purged every minute. Cookies are
# HttpOnly (session) and SameSite=Lax; set COOKIE_SECURE=true wherever the app is served over HTTPS.
spring.session.jdbc.initialize-schema=never
insight.security.cookie-secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=SESSION
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${insight.security.cookie-secure}

# Reverse proxies: forwarded headers (X-Forwarded-For/-Proto) are ignored unless the TCP peer is
# listed in TRUSTED_PROXIES (comma-separated IPs or CIDR ranges, e.g. 10.0.0.0/8). Spring's own
# forwarded-header handling stays off, even on platforms where Boot would enable it by default.
server.forward-headers-strategy=none
insight.security.trusted-proxies=${TRUSTED_PROXIES:}

# Where the web app is served: links in account emails point to its pages (/reset-password, /invite).
insight.accounts.web-base-url=${WEB_BASE_URL:http://localhost:5173}

# Account emails (password resets, verification, invitations) go out over SMTP. The defaults reach
# the development mail catcher (Mailpit in infra/compose.yaml; read mail at http://localhost:8025).
# Emails are queued in the mail_outbox table and sent by a worker on every instance, with bounded
# retries (insight.mail.outbox.*: poll-interval, retry-delays, batch-size, lease, retention).
# Their content (secret links) is never logged and is erased once sent or abandoned.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
insight.mail.from=${MAIL_FROM:Insight Studio <no-reply@insight-studio.localhost>}
# A mail server outage must not mark the API unhealthy.
management.health.mail.enabled=false

# CSV import upload limits (imports require the ADMIN or OWNER role).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Reports (docs/cube-reports.md): the raw totals of /api/reports/** and saved reports come from
# PostgreSQL ("sql", the default) or from Cube ("cube", which needs INSIGHT_CUBE_URL and
# CUBEJS_API_SECRET, see docs/analytics.md). REPORTS_CUBE_TIMEOUT is the overall deadline for the
# Cube calls of one report request. Every report response says which engine ran (X-Report-Engine).
insight.reports.engine=${REPORTS_ENGINE:sql}
insight.reports.cube-timeout=${REPORTS_CUBE_TIMEOUT:PT10S}
