spring.application.name=insight-api

# Local development reads POSTGRES_* from infra/.env (git-ignored) when it exists.
# The paths cover running from apps/api (mvnw) and from the repository root (some IDEs).
spring.config.import=optional:file:../../infra/.env[.properties],optional:file:infra/.env[.properties]

# DB_* environment variables take precedence over infra/.env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/${POSTGRES_DB:insight_studio}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:insight}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
