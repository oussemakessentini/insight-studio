# Throwaway stack for load tests (docs/load-testing.md): the production images, the demo data set (10 397 sales),
# the local fake payment provider and Mailpit, so imports, dashboards, exports and the background workers
# (webhook events, mail outbox) can be exercised without any external service. Never point it at real data.
#
#   API_IMAGE=insight-api:<tag> WEB_IMAGE=insight-web:<tag> tests/load/run.sh
name: insight-load

services:
  db:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_DB: insight
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: ${LOAD_DB_PASSWORD:?generated by run.sh}
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
      MP_MAX_MESSAGES: "5000"

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Not "prod": the fake payment provider and the demo data are refused there.
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/insight
      DB_USERNAME: insight
      DB_PASSWORD: ${LOAD_DB_PASSWORD}
      WEB_BASE_URL: http://localhost:8097
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      BILLING_PROVIDER: fake
      MANAGEMENT_PORT: "8081"
      LOG_FORMAT: ecs
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      MANAGEMENT_SERVER_PORT: "8081"
      # Many sign-ins from one address (k6): the per-IP limits would otherwise refuse the virtual users.
      TRUSTED_PROXIES: ""
      # The demo business is on Free: raise its limits so the load is not refused by plan limits.
      BILLING_FREE_MAX_MEMBERS: "1000"
      BILLING_FREE_MAX_CHARTS: "200"
      BILLING_FREE_MAX_DASHBOARDS: "50"
      BILLING_FREE_MAX_IMPORTS_PER_MONTH: "100000"
      BILLING_FREE_MAX_STORES: "100"
    ports:
      - "127.0.0.1:8098:8081"
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "2"

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8097:8080"
