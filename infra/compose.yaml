services:
  db:
    image: postgres:16-alpine
    container_name: insight-studio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development mail catcher: the API's password-reset and invitation emails land here
  # (SMTP 127.0.0.1:1025, the API's default) and nothing leaves the machine. Read them at
  # http://localhost:8025. Deployed environments use a real SMTP server instead (MAIL_HOST, ...).
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      # Skip the reverse DNS lookup of each SMTP client (slow through Docker Desktop).
      MP_SMTP_DISABLE_RDNS: "true"

  # Cube semantic layer over the same database (model in services/analytics).
  # Opt-in: docker compose --profile analytics up -d. Plain `up` starts db and mailpit.
  # Private: the Spring API is its only client. Production mode (no Playground, no
  # dev endpoints); every request needs a short-lived JWT signed with
  # CUBEJS_API_SECRET that names one business (services/analytics/security.js).
  # Published on 127.0.0.1 only, for the API running on the host. See docs/analytics.md.
  cube:
    image: cubejs/cube:v1.7.46
    profiles: ["analytics"]
    depends_on:
      db:
        condition: service_healthy
      cubestore:
        condition: service_started
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: db
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: ${POSTGRES_DB}
      CUBEJS_DB_USER: ${POSTGRES_USER}
      CUBEJS_DB_PASS: ${POSTGRES_PASSWORD}
      # Required, at least 32 characters: Cube refuses every request otherwise.
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_DEV_MODE: "false"
      NODE_ENV: production
      # This single instance also refreshes the pre-aggregations. Keep it that way while the API
      # uses it for reports (REPORTS_ENGINE=cube): the API asks it to rebuild rollups after data
      # changes ("cache": "must-revalidate"), which an API-only Cube without a worker ignores.
      CUBEJS_REFRESH_WORKER: "true"
      CUBEJS_CUBESTORE_HOST: cubestore
      CUBEJS_SCHEDULED_REFRESH_TIMEZONES: ${CUBEJS_SCHEDULED_REFRESH_TIMEZONES:-America/New_York}
      # Deleting a business (docs/data-retention.md): Cube drops a superseded rollup table only at the
      # end of a later build, and only once the table has not been touched for this many seconds
      # (default 24 h). The API's purge worker forces that later build after CUBE_PURGE_SWEEP_DELAY
      # (default 70 min), which must exceed this value and CUBEJS_DB_QUERY_TIMEOUT (default 10 min).
      # Cleanup is eventual: while Cube is down the purge is retried until it succeeds.
      CUBEJS_TOUCH_PRE_AGG_TIMEOUT: "3600"
      CUBEJS_DROP_PRE_AGG_WITHOUT_TOUCH: "true"
      CUBEJS_TELEMETRY: "false"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ../services/analytics:/cube/conf:ro

  # Stores Cube's pre-aggregations (rollups). Not published: only the cube service reaches it.
  cubestore:
    image: cubejs/cubestore:v1.7.46
    profiles: ["analytics"]
    environment:
      CUBESTORE_REMOTE_DIR: /cube/data
      CUBESTORE_TELEMETRY: "false"
    volumes:
      # A named volume, not a bind mount: rollup uploads failed on a Windows bind mount.
      - cubestore_data:/cube/data

volumes:
  postgres_data:
  cubestore_data: