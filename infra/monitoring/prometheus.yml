# Prometheus for infra/compose.prod.yaml (--profile monitoring; docs/operations.md). Scrapes the API's
# management port inside the compose network. Point an Alertmanager at it to deliver the alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: insight-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
