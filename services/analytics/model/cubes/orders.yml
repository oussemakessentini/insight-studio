# One row per order: a receipt (sales row) with at least one line item.
# The inner join on sale_items drops receipts without items, matching the API's
# definition (apps/api/.../reporting/ReportSql.java), so every measure agrees with it.
#
# Freshness marker (docs/cube-reports.md): every row carries data_version, the
# report_data_version read by the same SQL statement as the rows, so a table built from
# this SQL holds exactly the data of that version. One extra "marker" row per business
# (id, store_id and sold_at NULL; no revenue, units or count) carries the version even
# for a business without sales; queries with a date range never see it.
cubes:
  - name: orders
    title: Orders
    description: Receipts with at least one line item, with their totals at the prices charged.
    sql: >
      SELECT s.id,
             st.business_id,
             s.store_id,
             s.receipt_number,
             s.sold_at,
             SUM(si.quantity)                 AS units,
             SUM(si.quantity * si.unit_price) AS revenue,
             (SELECT v.version FROM report_data_version v WHERE v.id = 1) AS data_version
      FROM sales s
      JOIN stores st ON st.id = s.store_id
      JOIN sale_items si ON si.sale_id = s.id
      GROUP BY s.id, st.business_id, s.store_id, s.receipt_number, s.sold_at
      UNION ALL
      SELECT NULL, b.id, NULL, NULL, NULL, NULL, NULL, v.version
      FROM businesses b
      CROSS JOIN report_data_version v
      WHERE v.id = 1

    # Query-cache key for queries not served by a rollup: changes with any report data.
    refresh_key:
      sql: SELECT version, (SELECT MAX(id) FROM businesses) AS last_business FROM report_data_version WHERE id = 1
      every: 1 second

    joins:
      - name: stores
        relationship: many_to_one
        sql: "{CUBE}.store_id = {stores}.id"

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
        public: true

      - name: business_id
        description: Owning business. Every query is filtered on it (services/analytics/security.js).
        sql: business_id
        type: number

      - name: receipt_number
        sql: receipt_number
        type: string

      - name: store_id
        sql: store_id
        type: number

      - name: sold_at
        title: Sold at
        description: Sale timestamp; day/week/month buckets follow the query's timezone.
        sql: sold_at
        type: time

    measures:
      - name: count
        title: Orders
        description: Number of receipts with at least one line item (marker rows have no id and are not counted).
        sql: id
        type: count

      - name: revenue
        title: Revenue
        description: SUM(quantity * unit_price) over the order's line items.
        sql: revenue
        type: sum
        format: currency

      - name: units
        title: Units sold
        sql: units
        type: sum

      - name: average_order_value
        title: Average order value
        description: Revenue / orders (derived from additive measures, so rollups can serve it).
        sql: "{revenue} / NULLIF({count}, 0)"
        type: number
        format: currency

      - name: data_version
        title: Data version
        description: >
          report_data_version the rows were read at (the same for every row of one build).
          The API compares it with the version it read before querying (docs/cube-reports.md).
        sql: data_version
        type: max

    pre_aggregations:
      # Daily totals per business and store. Additive measures only (plus the max of the
      # data version), so any coarser time bucket (week, month) and any subset of stores rolls
      # up exactly. business_id is a dimension so the mandatory business filter (security.js)
      # is served from this rollup, which all businesses share.
      #
      # Rebuilt whenever report_data_version changes (checked every second, and on every
      # request the API sends with cache "must-revalidate").
      #
      # Deliberately not partitioned. With partition_granularity, Cube v1.7.46
      #  - clips a partition built on demand to the requesting query's date range and
      #    then reuses that partial table for later queries (a one-day query built a
      #    "March" partition holding only March 1), and
      #  - with the default build range, ends the last partition at the latest sale's
      #    local wall-clock time read as UTC, dropping that evening's sales.
      # Both were caught by scripts/reconcile.mjs. One daily table is tiny at this data
      # volume and is rebuilt whole on each refresh.
      - name: daily_by_store
        measures:
          - orders.count
          - orders.revenue
          - orders.units
          - orders.data_version
        dimensions:
          - orders.business_id
          - orders.store_id
        time_dimension: orders.sold_at
        granularity: day
        refresh_key:
          sql: SELECT version, (SELECT MAX(id) FROM businesses) AS last_business FROM report_data_version WHERE id = 1
          every: 1 second
